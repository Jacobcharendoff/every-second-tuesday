<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EST · Ben & Krista">
<meta name="theme-color" content="#000000">
<title>EST · Stage</title>
<style>
  :root {
    --bg: #000;
    --fg: #f4ede1;
    --dim: rgba(244,237,225,0.42);
    --dim-2: rgba(244,237,225,0.14);
    --accent: #ff2e6e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }

  #stage {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; flex-direction: column;
    transition: background-color 0.35s ease;
  }

  /* ─── TOP ─── */
  .top {
    padding: clamp(8px, 1.8vh, 20px) clamp(14px, 4vw, 32px) clamp(4px, 1vh, 10px);
    display: flex; align-items: center; gap: clamp(8px, 2vw, 18px);
    flex-shrink: 0;
  }
  .progress { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .progress .dot {
    flex: 1; height: 4px;
    background: var(--dim-2);
    border-radius: 2px;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .progress .dot.done { background: rgba(244,237,225,0.55); }
  .progress .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .pos {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: clamp(10px, 1.4vh, 13px);
    font-weight: 700;
    color: var(--dim);
    letter-spacing: 0.18em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ─── BODY ─── */
  .body {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: clamp(10px, 2vh, 22px) clamp(16px, 4.5vw, 44px);
    overflow: hidden;
  }
  .label {
    padding-bottom: clamp(8px, 1.4vh, 14px);
    border-bottom: 1px solid var(--dim-2);
    margin-bottom: clamp(12px, 2.4vh, 26px);
  }
  .label .kicker {
    font-family: "SF Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: clamp(9px, 1.4vh, 12px);
    letter-spacing: 0.30em; text-transform: uppercase;
    color: var(--dim);
    display: block;
  }
  .label .name {
    font-weight: 900;
    font-size: clamp(15px, 2.4vh, 24px);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent);
    text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
    padding-top: 3px;
    display: block;
  }

  .songs {
    list-style: none;
    display: flex; flex-direction: column;
    gap: clamp(4px, 1.6vh, 20px);
  }
  .song {
    font-weight: 900;
    /* KEY FIX: use narrower of width and height so long titles fit iPhone */
    font-size: clamp(20px, min(6.4vh, 7.6vw), 96px);
    line-height: 1.02;
    letter-spacing: -0.024em;
    color: var(--fg);
    display: flex; align-items: baseline; gap: clamp(8px, 1.6vw, 24px);
    overflow-wrap: break-word;
    word-break: normal;
    hyphens: none;
  }
  .song .num {
    font-family: "SF Mono", ui-monospace, monospace;
    font-size: clamp(11px, 1.7vh, 22px);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
    flex-shrink: 0;
    min-width: 1.6em;
    text-align: right;
    align-self: flex-start;
    padding-top: 0.55em;
  }
  .song .title {
    flex: 1;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: normal;
  }

  /* ─── BOTTOM ─── */
  .bot {
    padding: clamp(6px, 1vh, 10px) clamp(10px, 3vw, 20px) calc(env(safe-area-inset-bottom) + clamp(10px, 1.8vh, 18px));
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .btn {
    -webkit-appearance: none; appearance: none;
    background: rgba(244,237,225,0.10);
    color: var(--fg);
    border: 1.5px solid rgba(244,237,225,0.30);
    border-radius: 999px;
    padding: clamp(9px, 1.4vh, 15px) clamp(16px, 4vw, 32px);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(11px, 1.6vh, 16px);
    font-weight: 900;
    letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer;
    z-index: 20;
    position: relative;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    transition: transform 0.06s ease, background 0.15s ease, box-shadow 0.2s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn.next {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border-color: var(--accent);
    color: var(--fg);
    box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .btn.next:active { background: var(--accent); color: #000; }

  /* ─── COVER / BREAK / END ─── */
  .cover, .break, .end {
    text-align: center;
    justify-content: center;
    padding: clamp(20px, 5vh, 60px) clamp(18px, 5vw, 44px);
  }
  .cover .brand, .end .brand {
    font-size: clamp(40px, min(10vh, 15vw), 130px);
    font-weight: 900;
    letter-spacing: -0.028em;
    line-height: 0.92;
    text-transform: uppercase;
  }
  .cover .sub, .end .sub {
    font-size: clamp(11px, 1.7vh, 18px);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    padding-top: clamp(12px, 2.2vh, 22px);
  }
  .cover .accent {
    color: var(--accent);
    text-shadow: 0 0 26px color-mix(in srgb, var(--accent) 60%, transparent);
    padding-top: clamp(20px, 4vh, 40px);
    font-size: clamp(20px, min(3.8vh, 6vw), 44px);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .break .banner {
    font-size: clamp(52px, min(14vh, 20vw), 200px);
    font-weight: 900;
    letter-spacing: 0.16em;
    color: var(--accent);
    text-shadow: 0 0 38px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .break .sub {
    color: var(--dim);
    font-size: clamp(12px, 1.8vh, 22px);
    padding-top: clamp(16px, 2.6vh, 30px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    line-height: 1.5;
  }

  /* Tap zones */
  .tapleft, .tapright { position: fixed; top: 0; bottom: 0; width: 30%; z-index: 10; }
  .tapleft  { left: 0; }
  .tapright { right: 0; }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 70px);
    left: 50%; transform: translateX(-50%);
    background: rgba(244,237,225,0.12);
    color: var(--fg);
    padding: 8px 16px; border-radius: 999px;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.24em; text-transform: uppercase;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }

  /* ─── RESPONSIVE ─── */
  /* iPhone landscape — very short, compact everything */
  @media (orientation: landscape) and (max-height: 500px) {
    .top { padding: 6px 18px 3px; }
    .body { padding: 6px 28px; }
    .label { padding-bottom: 6px; margin-bottom: 8px; }
    .label .kicker { font-size: 8px; letter-spacing: 0.24em; }
    .label .name { font-size: 12px; letter-spacing: 0.14em; }
    .songs { gap: 3px; }
    .song { font-size: min(8vh, 44px); }
    .song .num { font-size: 10px; padding-top: 0.5em; }
    .bot { padding: 3px 14px calc(env(safe-area-inset-bottom) + 6px); }
    .btn { padding: 7px 16px; font-size: 10px; }
  }

  /* iPad landscape — bigger, roomier */
  @media (orientation: landscape) and (min-width: 900px) {
    .song { font-size: min(10vh, 118px); }
    .label .name { font-size: 26px; }
    .label .kicker { font-size: 13px; }
  }

  /* iPhone portrait — extra safety on very narrow screens */
  @media (max-width: 420px) {
    .song { font-size: min(6vh, 7vw); }
    .song .num { min-width: 1.4em; }
    .btn { padding: 10px 18px; font-size: 11px; letter-spacing: 0.16em; }
    .label .name { letter-spacing: 0.14em; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="tapleft" data-nav="prev"></div>
<div class="tapright" data-nav="next"></div>
<div class="toast" id="toast">Screen locked on</div>

<script>
const COLORS = [
  '#ff2e6e','#ff8a2e','#ffd93d','#a8e063','#4ecdc4',
  '#4a90e2','#9b59d0','#ff2eae','#ff6b6b','#ffa04d','#7dff5c'
];

const setlist = [
  { type: 'cover' },
  { kicker: 'Set 1 · Mini-Set 1', name: 'Warm the Room',
    songs: ['Oh! Darling','Johnny B. Goode','Take Me Out','Song 2']},
  { kicker: 'Set 1 · Mini-Set 2', name: 'Classic Rock Kick',
    songs: ['Rock You Like a Hurricane','Born to Be Wild','Paint It Black','Sweet Emotion']},
  { kicker: 'Set 1 · Mini-Set 3', name: 'Groove Zone',
    songs: ['Money','Shakedown Street','Funk #49','War Pigs']},
  { kicker: 'Set 1 · Mini-Set 4', name: 'Bar Anthems',
    songs: ['Break On Through','All Right Now','Watermelon Sugar','Are You Gonna Be My Girl']},
  { kicker: 'Set 1 · Mini-Set 5', name: 'Set One Closer',
    songs: ['Sex on Fire','You Shook Me All Night Long','Simply the Best','Don’t Stop Believin’']},
  { type: 'break' },
  { kicker: 'Set 2 · Mini-Set 1', name: 'Pink Floyd Opener',
    songs: ['Breathe','Time']},
  { kicker: 'Set 2 · Mini-Set 2', name: 'Bang the Room Awake',
    songs: ['Mr. Brightside','Somebody Told Me','Vertigo','All the Small Things']},
  { kicker: 'Set 2 · Mini-Set 3', name: 'Modern Rock Peak',
    songs: ['All Star','Learn to Fly','Californication','Ramblin’ Man']},
  { kicker: 'Set 2 · Mini-Set 4', name: 'Groove Breath → Heavy',
    songs: ['They Love Each Other','Norwegian Wood','I Want You (She’s So Heavy)','Rock and Roll']},
  { kicker: 'Set 2 · Mini-Set 5', name: 'Heavy Bridge',
    songs: ['It’s a Long Way to the Top','Burnin’ for You','Carry On Wayward Son']},
  { kicker: 'Set 2 · Mini-Set 6', name: 'The Big Finish',
    songs: ['Seven Nation Army','Livin’ on a Prayer','Closing Time','Wonderwall']},
  { type: 'end' },
];

const miniIdxs = setlist.map((s,i) => s.type ? -1 : i).filter(i => i >= 0);
const total = miniIdxs.length;
let cur = 0;
const stage = document.getElementById('stage');
const toast = document.getElementById('toast');

function colorFor(index) {
  const s = setlist[index];
  if (s.type === 'cover') return COLORS[0];
  if (s.type === 'end') return COLORS[COLORS.length - 1];
  if (s.type === 'break') {
    const nextMini = miniIdxs.find(i => i > index);
    return nextMini != null ? COLORS[miniIdxs.indexOf(nextMini)] : COLORS[0];
  }
  return COLORS[miniIdxs.indexOf(index)];
}

function progressBar(activeMini) {
  const dots = [];
  for (let i = 0; i < total; i++) {
    let cls = 'dot';
    if (activeMini != null && i < activeMini) cls += ' done';
    if (activeMini != null && i === activeMini) cls += ' active';
    dots.push(`<div class="${cls}"></div>`);
  }
  return `<div class="progress">${dots.join('')}</div>`;
}

function render(i) {
  const s = setlist[i];
  document.documentElement.style.setProperty('--accent', colorFor(i));
  if (s.type === 'cover') {
    stage.innerHTML = `
      <div class="body cover">
        <div class="brand">Every<br>Second<br>Tuesday</div>
        <div class="accent">Ben &amp; Krista</div>
        <div class="sub">July 11, 2026 · 8 Humewood Dr · Toronto</div>
      </div>
      <div class="bot">
        <button class="btn prev" data-nav="prev" type="button" style="opacity:0.35">‹ Prev</button>
        <button class="btn next" data-nav="next" type="button">Start ›</button>
      </div>`;
    return;
  }
  if (s.type === 'break') {
    stage.innerHTML = `
      <div class="body break">
        <div class="banner">BREAK</div>
        <div class="sub">Twenty minutes.<br>Water. Tuning. Come back hot.</div>
      </div>
      <div class="bot">
        <button class="btn prev" data-nav="prev" type="button">‹ Prev</button>
        <button class="btn next" data-nav="next" type="button">Set Two ›</button>
      </div>`;
    return;
  }
  if (s.type === 'end') {
    stage.innerHTML = `
      <div class="body end">
        <div class="brand">Thank you.</div>
        <div class="sub">Ben &amp; Krista · 07.11.2026</div>
        <div class="accent">EST</div>
      </div>
      <div class="bot">
        <button class="btn prev" data-nav="prev" type="button">‹ Prev</button>
        <button class="btn next" data-nav="next" type="button" style="opacity:0.35">Next ›</button>
      </div>`;
    return;
  }
  const miniIdx = miniIdxs.indexOf(i);
  const posText = `${String(miniIdx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
  const songsHTML = s.songs.map((title, idx) => `
    <li class="song">
      <span class="num">${String(idx + 1).padStart(2, '0')}</span>
      <span class="title">${title}</span>
    </li>`).join('');
  stage.innerHTML = `
    <div class="top">
      ${progressBar(miniIdx)}
      <div class="pos">${posText}</div>
    </div>
    <div class="body">
      <div class="label">
        <span class="kicker">${s.kicker}</span>
        <span class="name">${s.name}</span>
      </div>
      <ul class="songs">${songsHTML}</ul>
    </div>
    <div class="bot">
      <button class="btn prev" data-nav="prev" type="button">‹ Prev</button>
      <button class="btn next" data-nav="next" type="button">Next ›</button>
    </div>`;
}

function go(delta) {
  cur = Math.max(0, Math.min(setlist.length - 1, cur + delta));
  render(cur);
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (!nav) return;
  e.stopPropagation();
  go(nav.dataset.nav === 'next' ? 1 : -1);
});

let sx = 0, sy = 0, st = 0;
document.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  sx = t.screenX; sy = t.screenY; st = Date.now();
}, { passive: true });
document.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.screenX - sx, dy = t.screenY - sy, dt = Date.now() - st;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) && dt < 800) {
    go(dx < 0 ? 1 : -1);
  }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp') go(-1);
  if (e.key === 'Home') { cur = 0; render(cur); }
  if (e.key === 'End')  { cur = setlist.length - 1; render(cur); }
});

let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      showToast('Screen locked on');
    }
  } catch (e) {}
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
document.addEventListener('click', requestWakeLock, { once: true });
document.addEventListener('touchstart', requestWakeLock, { once: true });

render(cur);
</script>

</body>
</html>
